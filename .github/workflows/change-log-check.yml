name: Changelog Check

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [develop, prod]

jobs:
  enforce-changelog:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # Step 1: Checkout the PR code
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # <— fetch full history

      # ---------------------------------------------------------
      # Step 2: Fetch the base branch so git diff can compare them
      # ---------------------------------------------------------
      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1

      # ----------------------------------------------------
      # Step 3: Get PR labels
      # ----------------------------------------------------
      - name: Get PR labels
        id: labels
        run: |
          export GH_TOKEN="${{ github.token }}"
          labels=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name' | tr '\n' ',' || echo "")
          echo "labels=$labels" >> $GITHUB_OUTPUT
          echo "Detected labels: $labels"

      # ------------------------------------------------------------------
      # Step 4: Skip changelog enforcement if labeled with "NO CHANGELOG"
      # ------------------------------------------------------------------
      - name: Evaluate Labels
        id: evaluate
        run: |
          echo "Labels found: ${{ steps.labels.outputs.labels }}"

          if [[ "${{ steps.labels.outputs.labels }}" == *"NO CHANGELOG"* ]]; then
            echo "Label 'NO CHANGELOG' found — skipping changelog validation."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      # --------------------------------------------------------
      # Step 5: If no skip label, require CHANGELOG.md modification
      # --------------------------------------------------------
      - name: Ensure CHANGELOG.md was updated
        if: steps.evaluate.outputs.skip == 'false'
        run: |
          echo "Checking if CHANGELOG.md was updated against origin/${{ github.base_ref }}..."

          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "CHANGELOG.md"; then
            echo "CHANGELOG.md was not updated."
            echo "Either update it OR apply the 'NO CHANGELOG' label if this is a trivial fix. Do not be lazy! :)"
            exit 1
          fi

          echo "CHANGELOG.md update detected. All G Bruh!"
